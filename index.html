<div class="modal-overlay" id="settings-modal" onclick="if(event.target.id==='settings-modal')closeSettings()"><div class="modal"><div class="modal-handle"></div><h2>Settings</h2><div class="settings-section"><h3>Wake-up time</h3><div class="wake-picker-row"><label>I wake up at</label><input type="time" id="wake-time-input" value="09:00"></div><p class="settings-note" id="sleep-summary">Sleep and in-bed times are calculated automatically.</p></div><div class="modal-actions"><button class="btn-secondary" onclick="closeSettings()">Cancel</button><button class="btn-primary" onclick="saveSettings()">Apply</button></div></div></div>
<button class="now-float" onclick="goToTodayNow()">Now</button>
<div class="toast" id="toast"></div>
<script>
'use strict';
const WEEK_DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_KIND={0:'recovery',1:'weights',2:'cardio',3:'recovery',4:'weights',5:'cardio',6:'recovery'};
const DEFAULT_AVOIDS=[];
const GYM_BASE=[['09:00',25,'wake','🌅 Wake Up & Hygiene'],['09:25',5,'prep','🍳 Prep Breakfast'],['09:30',30,'eat','🍽️ Eat Breakfast'],['10:00',30,'movement','🚶‍♂️ Glucose Sink Walk'],['10:30',85,'deepWork','💻 Deep Work & Reading'],['11:55',5,'prep','🥜 Prep Mid-Morning Snack'],['12:00',15,'eat','🍌 Eat Mid-Morning Snack'],['12:15',30,'movement','🚲 E-Bike Commute & Warm-Up'],['12:45',45,'movement','GYM_SLOT'],['13:30',30,'movement','🚲 E-Bike Commute & Cool-Down'],['14:00',15,'downtime','🚿 Quick Body Rinse / Transition'],['14:15',15,'prep','🥗 Prep Lunch'],['14:30',30,'eat','🍽️ Eat Lunch'],['15:00',115,'deepWork','💻 Deep Work & Reading'],['16:55',5,'prep','🥜 Prep Afternoon Snack'],['17:00',15,'eat','🍎 Eat Afternoon Snack'],['17:15',45,'admin','📱 Admin & Messages'],['18:00',45,'downtime','🎵 Buffer / Light Chores'],['18:45',45,'prep','🍲 Cook/Prep Dinner'],['19:30',30,'eat','🍽️ Eat Dinner'],['20:00',85,'downtime','📺 Screen Downtime'],['21:25',5,'prep','🌙 Prep Pre-Bed Snack'],['21:30',15,'eat','🥣 Eat Pre-Bed Snack'],['21:45',30,'night','🚿 Evening Hygiene & Core Cooling'],['22:15',75,'night','📚 Screen-Free Wind Down'],['23:30',30,'night','🛏️ In Bed'],['00:00',540,'night','💤 Sleep']];
const RECOVERY_BASE=[['09:00',25,'wake','🌅 Wake Up & Hygiene'],['09:25',5,'prep','🍳 Prep Breakfast'],['09:30',30,'eat','🍽️ Eat Breakfast'],['10:00',30,'movement','🚶‍♂️ Glucose Sink Walk'],['10:30',85,'deepWork','💻 Deep Work & Reading'],['11:55',5,'prep','🥜 Prep Mid-Morning Snack'],['12:00',15,'eat','🍌 Eat Mid-Morning Snack'],['12:15',60,'movement','🎧 Long Processing/Admin Walk'],['13:15',60,'downtime','🚿 Shower / Free Time'],['14:15',15,'prep','🥗 Prep Lunch'],['14:30',30,'eat','🍽️ Eat Lunch'],['15:00',115,'deepWork','💻 Deep Work & Reading'],['16:55',5,'prep','🥜 Prep Afternoon Snack'],['17:00',15,'eat','🍎 Eat Afternoon Snack'],['17:15',45,'admin','📱 Admin & Messages'],['18:00',45,'downtime','🎵 Buffer / Light Chores'],['18:45',45,'prep','🍲 Cook/Prep Dinner'],['19:30',45,'eat','🍽️ Eat Dinner'],['20:15',45,'movement','🚶‍♂️ Wind-Down Walk'],['21:00',25,'downtime','📺 Screen Downtime'],['21:25',5,'prep','🌙 Prep Pre-Bed Snack'],['21:30',15,'eat','🥣 Eat Pre-Bed Snack'],['21:45',30,'night','🚿 Evening Hygiene & Core Cooling'],['22:15',75,'night','📚 Screen-Free Wind Down'],['23:30',30,'night','🛏️ In Bed'],['00:00',540,'night','💤 Sleep']];
let blocks=[],avoids=[],wakeHour=9,wakeMins=0,currentPage='planner',selectedWeekday=new Date().getDay(),lastToday=new Date().getDay(),snapAfterNextRender=true,weekSettleTimer=null,isWeekSnapping=false;
function $(id){return document.getElementById(id)}function parseJSON(v,f){try{return v?JSON.parse(v):f}catch{return f}}function escapeHTML(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toMins(t){const [h,m]=t.split(':').map(Number);return h*60+m}function wakeToAbsMins(){return wakeHour*60+wakeMins}function wakeShiftMins(){return wakeToAbsMins()-540}function normaliseMins(n){return((n%1440)+1440)%1440}function minsToTime(total){const n=normaliseMins(total),h=Math.floor(n/60),m=n%60,p=h>=12?'pm':'am',dh=h===0?12:h>12?h-12:h;return `${dh}:${String(m).padStart(2,'0')}${p}`}function sortKey(abs){let key=abs,dayStart=wakeToAbsMins()-60;while(key<dayStart)key+=1440;return key}function dayKey(prefix){return `${prefix}_${selectedWeekday}`}function todayISO(){return new Date().toISOString()}function startOfTodayISO(){const d=new Date();d.setHours(0,0,0,0);return d.toISOString()}function daysSince(iso){const t=new Date(iso).getTime();return Number.isFinite(t)?Math.max(0,Math.floor((Date.now()-t)/86400000)):0}function sinceLabel(iso){const d=new Date(iso);return Number.isNaN(d.getTime())?'Started today':`Since ${d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}`}function normaliseAvoids(raw){const source=Array.isArray(raw)?raw:DEFAULT_AVOIDS;return source.map(item=>typeof item==='string'?{text:item,since:startOfTodayISO()}:{text:item.text||'Untitled',since:item.since||startOfTodayISO()})}
function typeClass(t){return{wake:'wake-block',prep:'prep-block',eat:'eat-block',night:'night-block',movement:'movement-block',deepWork:'deepWork-block',admin:'admin-block',downtime:'downtime-block'}[t]||'downtime-block'}function typeLabel(t){return{wake:'Wake',prep:'Prep',eat:'Eat',night:'Night',movement:'Move',deepWork:'Focus',admin:'Admin',downtime:'Down'}[t]||t}
function baseForDay(day){return DAY_KIND[day]==='recovery'?RECOVERY_BASE:GYM_BASE}function buildBlocks(day=selectedWeekday){const kind=DAY_KIND[day],shift=wakeShiftMins();return baseForDay(day).map(([time,duration,type,title])=>{let actualTitle=title;if(title==='GYM_SLOT')actualTitle=kind==='cardio'?'💦 Cardio Machine Session':'🏋️‍♂️ Weights Session';const abs=toMins(time)+shift;return{baseTime:time,time:minsToTime(abs),absMins:abs,durationMins:duration,type,title:actualTitle,done:false}}).sort((a,b)=>sortKey(a.absMins)-sortKey(b.absMins))}
function rebuildBlocksFromTemplatePreservingDone(){const done=new Map(blocks.map(b=>[b.title,b.done]));blocks=buildBlocks(selectedWeekday).map(b=>({...b,done:!!done.get(b.title)}))}function blockHeightPx(i){const mins=blocks[i]?.durationMins||30;return Math.round(Math.min(280,Math.max(76,mins*2.15)))}
function load(){const savedWake=localStorage.getItem('dp_wake');if(savedWake){const p=savedWake.split(':').map(Number);if(Number.isFinite(p[0])&&Number.isFinite(p[1])){wakeHour=p[0];wakeMins=p[1]}}const version='complete-pwa-v12';if(localStorage.getItem('dp_schedule_version')!==version){localStorage.setItem('dp_schedule_version',version)}selectedWeekday=new Date().getDay();lastToday=selectedWeekday;avoids=normaliseAvoids(parseJSON(localStorage.getItem('dp_avoids2'),[]));loadSelectedDay();save()}function loadSelectedDay(){const saved=parseJSON(localStorage.getItem(dayKey('dp_blocks2')),null);if(Array.isArray(saved)&&saved.length){blocks=saved;rebuildBlocksFromTemplatePreservingDone()}else blocks=buildBlocks(selectedWeekday)}function save(){localStorage.setItem(dayKey('dp_blocks2'),JSON.stringify(blocks));localStorage.setItem('dp_avoids2',JSON.stringify(avoids));localStorage.setItem('dp_wake',`${wakeHour}:${wakeMins}`)}function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
function sleepToAbsMins(){return wakeToAbsMins()-540}function inBedToAbsMins(){return sleepToAbsMins()-30}function updateSleepSummary(){const el=$('sleep-summary');if(el)el.textContent=`In bed: ${minsToTime(inBedToAbsMins())}. Sleep: ${minsToTime(sleepToAbsMins())}. Wake-up gives you a 9-hour sleep window.`}
function openSettings(){$('wake-time-input').value=`${String(wakeHour).padStart(2,'0')}:${String(wakeMins).padStart(2,'0')}`;updateSleepSummary();$('settings-modal').classList.add('open');document.body.classList.add('modal-open')}function closeSettings(){$('settings-modal').classList.remove('open');document.body.classList.remove('modal-open')}function saveSettings(){const w=$('wake-time-input').value;if(w){[wakeHour,wakeMins]=w.split(':').map(Number)}rebuildBlocksFromTemplatePreservingDone();save();updateSleepSummary();snapAfterNextRender=true;render();closeSettings();toast('Wake-up time saved.')}
function renderWeekPills(){const el=$('week-pills');el.innerHTML=WEEK_DAYS.map((d,i)=>`<button class="week-pill ${i===selectedWeekday?'active':''} ${i===new Date().getDay()?'today':''}" onclick="selectWeekday(${i})">${d}</button>`).join('');snapWeekStrip()}function snapWeekStrip(delay=80){const bar=$('week-bar'),active=document.querySelector('.week-pill.active');if(!bar||!active)return;clearTimeout(weekSettleTimer);setTimeout(()=>{const left=active.offsetLeft-(bar.clientWidth-active.clientWidth)/2;isWeekSnapping=true;bar.scrollTo({left:Math.max(0,left),behavior:'smooth'});setTimeout(()=>{isWeekSnapping=false},500)},delay)}function scheduleWeekSnap(){if(isWeekSnapping)return;clearTimeout(weekSettleTimer);weekSettleTimer=setTimeout(()=>snapWeekStrip(0),650)}function selectWeekday(day){save();selectedWeekday=day;loadSelectedDay();renderWeekPills();snapAfterNextRender=false;render()}function goToTodayNow(){save();selectedWeekday=new Date().getDay();loadSelectedDay();renderWeekPills();snapAfterNextRender=true;openPlannerPage();setTimeout(()=>snapToCurrentBlock(0),120)}
function openPlannerPage(){currentPage='planner';document.body.classList.remove('avoid-mode','calendar-mode');$('planner-page').classList.remove('hidden');$('avoid-page').classList.add('hidden');$('calendar-page').classList.add('hidden');updateHeaderOffset();render()}function openAvoidPage(){currentPage='avoid';document.body.classList.add('avoid-mode');document.body.classList.remove('calendar-mode');$('planner-page').classList.add('hidden');$('calendar-page').classList.add('hidden');$('avoid-page').classList.remove('hidden');updateHeaderOffset();window.scrollTo({top:0,behavior:'smooth'});renderAvoidPage()}function openCalendarPage(){currentPage='calendar';document.body.classList.add('calendar-mode');document.body.classList.remove('avoid-mode');$('planner-page').classList.add('hidden');$('avoid-page').classList.add('hidden');$('calendar-page').classList.remove('hidden');updateHeaderOffset();window.scrollTo({top:0,behavior:'smooth'});renderCalendarPage()}
function renderAvoidPage(){const el=$('avoid-cards');if(!avoids.length){el.innerHTML='<p class="avoid-hint">Nothing here yet. Add something above to start an abstinence counter.</p>';return}el.innerHTML=avoids.map((a,i)=>`<section class="avoid-card"><div class="avoid-card-top"><div><div class="avoid-card-title">${escapeHTML(a.text)}</div><div class="avoid-card-sub">${escapeHTML(sinceLabel(a.since))}</div></div><div style="text-align:right"><div class="streak-days">${daysSince(a.since)}</div><div class="streak-label">days</div></div></div><div class="avoid-card-actions"><button class="btn-secondary" onclick="resetAvoidStreak(${i})">Reset counter</button><button class="btn-danger" onclick="removeAvoid(${i})">Remove</button></div></section>`).join('')}function addAvoid(){const input=$('avoid-input'),v=input.value.trim();if(!v)return;avoids.push({text:v,since:todayISO()});input.value='';save();renderAvoidPage();toast('Counter started.')}function removeAvoid(i){if(confirm(`Remove "${avoids[i].text}"?`)){avoids.splice(i,1);save();renderAvoidPage()}}function resetAvoidStreak(i){if(confirm(`Reset the counter for "${avoids[i].text}"?`)){avoids[i].since=todayISO();save();renderAvoidPage();toast('Counter reset.')}}function resetAllAvoidStreaks(){if(!avoids.length)return;if(confirm('Reset all abstinence counters?')){const now=todayISO();avoids=avoids.map(a=>({...a,since:now}));save();renderAvoidPage();toast('All counters reset.')}}function renderCalendarPage(){const now=new Date(),year=now.getFullYear(),month=now.getMonth(),today=now.getDate(),months=['January','February','March','April','May','June','July','August','September','October','November','December'];$('calendar-title').textContent=`${months[month]} ${year}`;const first=new Date(year,month,1).getDay(),daysInMonth=new Date(year,month+1,0).getDate();let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="calendar-weekday">${d}</div>`).join('');for(let i=0;i<first;i++)html+='<div class="calendar-day empty"></div>';for(let day=1;day<=daysInMonth;day++){const cls=day<today?'past':day===today?'today':'future';html+=`<div class="calendar-day ${cls}">${day}</div>`}$('calendar-grid').innerHTML=html}
function getActiveBlockIndexes(){const now=new Date(),nowKey=sortKey(now.getHours()*60+now.getMinutes());let current=-1,next=-1;blocks.forEach((b,i)=>{if(b.done)return;const key=sortKey(b.absMins);if(key<=nowKey)current=i;if(next===-1&&key>nowKey)next=i});return{current,next}}function currentDisplayIndex(active){return active.current>=0?active.current:active.next}function nextUnfinishedAfter(index){if(index<0)return-1;for(let i=index+1;i<blocks.length;i++){if(!blocks[i].done)return i}return-1}function updateHeaderOffset(){const header=document.querySelector('header');const offset=(header?header.offsetHeight:148)+14;document.documentElement.style.setProperty('--header-offset',`${offset}px`);return offset}function updateSnapOffset(){return updateHeaderOffset()+12}function snapToCurrentBlock(delay=80){if(currentPage!=='planner')return;const target=document.querySelector('.block.current');if(!target)return;setTimeout(()=>{const top=target.getBoundingClientRect().top+window.scrollY-updateSnapOffset();window.scrollTo({top:Math.max(0,top),behavior:'smooth'})},delay)}
function render(){if(currentPage!=='planner')return;updateHeaderOffset();document.body.classList.toggle('browsing-other-day',selectedWeekday!==new Date().getDay());blocks.sort((a,b)=>sortKey(a.absMins)-sortKey(b.absMins));const active=getActiveBlockIndexes(),currentIndex=currentDisplayIndex(active),nextIndex=nextUnfinishedAfter(currentIndex);$('blocks-container').innerHTML=blocks.map((b,i)=>`<div class="block ${typeClass(b.type)} ${b.done?'done':''} ${i===currentIndex?'current':''} ${i===nextIndex?'next':''}" data-block-index="${i}" style="--block-height:${blockHeightPx(i)}px" onclick="toggleDone(${i})"><div class="block-row"><div style="flex:1;min-width:0"><div class="block-meta"><span class="block-time">${escapeHTML(b.time)}</span><span class="block-tag">${escapeHTML(typeLabel(b.type))}</span></div><div class="block-title">${escapeHTML(b.title)}</div></div>${b.done?'<span class="block-done-mark">✓</span>':''}</div></div>`).join('');if(snapAfterNextRender){snapAfterNextRender=false;snapToCurrentBlock()}}function toggleDone(i){blocks[i].done=!blocks[i].done;save();render()}
function setDate(){const now=new Date(),days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],months=['January','February','March','April','May','June','July','August','September','October','November','December'];$('date-display').textContent=`${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`}function tick(){const today=new Date().getDay();if(today!==lastToday){const wasViewingToday=selectedWeekday===lastToday;lastToday=today;if(wasViewingToday){save();selectedWeekday=today;loadSelectedDay();snapAfterNextRender=true}renderWeekPills()}setDate();if(currentPage==='avoid')renderAvoidPage();else if(currentPage==='calendar')renderCalendarPage();else render()}function runTests(){const tests=[['build gym',buildBlocks(1).length===GYM_BASE.length],['build recovery',buildBlocks(3).length===RECOVERY_BASE.length],['monday weights',buildBlocks(1).some(b=>b.title.includes('Weights'))],['tuesday cardio',buildBlocks(2).some(b=>b.title.includes('Cardio'))],['wake shift',typeof wakeShiftMins()==='number']];console.info(`My Day tests: ${tests.filter(t=>t[1]).length}/${tests.length} passed`,tests)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='avoid-input')addAvoid();if(e.key==='Escape'){closeSettings();if(currentPage==='avoid'||currentPage==='calendar')openPlannerPage()}});if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').catch(()=>{})})}
load();renderWeekPills();setDate();updateHeaderOffset();tick();runTests();window.addEventListener('resize',updateHeaderOffset);$('week-bar').addEventListener('scroll',scheduleWeekSnap,{passive:true});setInterval(tick,60000);
</script>
